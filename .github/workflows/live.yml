name: live
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch history from Myfxbook
        env:
          MYFXBOOK_EMAIL: ${{ secrets.MYFXBOOK_EMAIL }}
          MYFXBOOK_PASSWORD: ${{ secrets.MYFXBOOK_PASSWORD }}
          MYFXBOOK_ACCOUNT: ${{ vars.MYFXBOOK_ACCOUNT }}
        run: python3 fetch_live.py
      - name: Commit
        run: |
          git config user.name "sonicdesk-live"
          git config user.email "sonicdesk-live@users.noreply.github.com"
          git add live.json
          git diff --cached --quiet || (git commit -m "live update" && git push)
